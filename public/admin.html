<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Успеваемость и ученики sheyx-proger." />
    <title>Панель администратора — sheyx-proger</title>
    <link rel="stylesheet" href="/style.css" />
    <link rel="stylesheet" href="/app.css" />
    <script src="/script.js" defer></script>
    <script src="/app.js" defer></script>
  </head>
  <body class="portal-page learning-page">
    <div class="page-bg"></div>
    <main class="portal-card dashboard-card admin-card">
      <header class="portal-header">
        <a class="brand" href="/">
          <span class="brand-mark">S</span><span>sheyx-proger</span>
        </a>
        <div class="header-actions">
          <div class="lang-switcher" aria-label="Language">
            <button class="lang-btn" data-lang="ru" type="button">RU</button><button class="lang-btn" data-lang="en" type="button">EN</button><button class="lang-btn" data-lang="tg" type="button">TJ</button>
          </div>
          <a class="btn btn-secondary small" href="/dashboard.html" data-i18n="account.myAccount">Мой кабинет</a>
          <button class="btn btn-secondary small" type="button" data-logout data-i18n="account.logout">Выйти</button>
        </div>
      </header>
      <div id="adminLoading" class="loading-state" data-i18n="account.checkingAccess">Проверяем права доступа…</div>
      <section id="adminContent" class="hidden">
        <p class="eyebrow" data-i18n="account.manageLearning">Управление обучением</p>
        <h1 data-i18n="account.studentsAndAchievements">Ученики и достижения</h1>
        <p class="portal-intro"><span data-i18n="account.admin">Администратор:</span> <strong id="adminEmail"></strong></p>
        <div class="admin-overview">
          <div class="profile-stat"><span data-i18n="account.students">Учеников</span><strong id="userCount">0</strong></div>
          <div class="profile-stat"><span data-i18n="account.lessonsCompletedTotal">Уроков завершено</span><strong id="lessonsCompletedCount">0</strong></div>
          <div class="profile-stat"><span data-i18n="account.totalXp">Всего XP заработано</span><strong id="totalXpCount">0</strong></div>
        </div>
        <section class="dashboard-panel">
          <div class="panel-title-row"><div><p class="eyebrow" data-i18n="account.growTogether">Соревнуйтесь и растите</p><h2 data-i18n="account.studentLeaderboard">Рейтинг учеников</h2></div></div>
          <div class="table-wrap">
            <table>
              <thead><tr><th data-i18n="leaderboard.rank">Место</th><th data-i18n="leaderboard.student">Ученик</th><th data-i18n="leaderboard.lessons">Завершено уроков</th><th>XP</th><th data-i18n="account.joined">Регистрация</th></tr></thead>
              <tbody id="adminUsers"></tbody>
            </table>
            <p id="noAdminUsers" class="empty-state hidden" data-i18n="account.noStudents">Пока никто не начал обучение.</p>
          </div>
        </section>
        <p class="form-message" data-page-message role="status"></p>
      </section>
    </main>
  </body>
</html>
