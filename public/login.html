<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Вход в личный кабинет sheyx-proger." />
    <title>Вход — sheyx-proger</title>
    <link rel="stylesheet" href="/style.css" />
    <link rel="stylesheet" href="/app.css" />
    <script src="/script.js" defer></script>
    <script src="/app.js" defer></script>
  </head>
  <body class="portal-page">
    <div class="page-bg"></div>
    <main class="portal-card">
      <a class="brand portal-brand" href="/">
        <span class="brand-mark">S</span><span>sheyx-proger</span>
      </a>
      <div class="portal-language lang-switcher" aria-label="Language">
        <button class="lang-btn" data-lang="ru" type="button">RU</button><button class="lang-btn" data-lang="en" type="button">EN</button><button class="lang-btn" data-lang="tg" type="button">TJ</button>
      </div>
      <p class="eyebrow" data-i18n="account.welcomeBack">С возвращением</p>
      <h1 data-i18n="account.signIn">Войти в аккаунт</h1>
      <p class="portal-intro" data-i18n="account.signInText">Продолжите обучение в личном кабинете.</p>
      <form id="loginForm" class="portal-form">
        <label class="field">
          <span data-i18n="account.email">Email</span>
          <input name="email" type="email" autocomplete="email" maxlength="254" required />
        </label>
        <label class="field">
          <span data-i18n="account.password">Пароль</span>
          <input name="password" type="password" autocomplete="current-password" maxlength="128" required />
        </label>
        <button class="btn btn-primary" type="submit" data-i18n="account.signIn">Войти</button>
        <p class="form-message" role="status" aria-live="polite"></p>
      </form>
      <p class="portal-switch"><span data-i18n="account.noAccount">Нет аккаунта?</span> <a href="/register.html" data-i18n="account.register">Зарегистрироваться</a></p>
      <a class="portal-home" href="/" data-i18n="account.home">← На главную</a>
    </main>
  </body>
</html>
