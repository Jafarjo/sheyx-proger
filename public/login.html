<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Вход в личный кабинет sheyx-proger." />
    <title>Вход — sheyx-proger</title>
    <link rel="stylesheet" href="/style.css" />
    <link rel="stylesheet" href="/app.css" />
    <script src="/app.js" defer></script>
  </head>
  <body class="portal-page">
    <div class="page-bg"></div>
    <main class="portal-card">
      <a class="brand portal-brand" href="/">
        <span class="brand-mark">S</span><span>sheyx-proger</span>
      </a>
      <p class="eyebrow">С возвращением</p>
      <h1>Войти в аккаунт</h1>
      <p class="portal-intro">Продолжите обучение в личном кабинете.</p>
      <form id="loginForm" class="portal-form">
        <label class="field">
          <span>Email</span>
          <input name="email" type="email" autocomplete="email" maxlength="254" required />
        </label>
        <label class="field">
          <span>Пароль</span>
          <input name="password" type="password" autocomplete="current-password" maxlength="128" required />
        </label>
        <button class="btn btn-primary" type="submit">Войти</button>
        <p class="form-message" role="status" aria-live="polite"></p>
      </form>
      <p class="portal-switch">Нет аккаунта? <a href="/register.html">Зарегистрироваться</a></p>
      <a class="portal-home" href="/">← На главную</a>
    </main>
  </body>
</html>
