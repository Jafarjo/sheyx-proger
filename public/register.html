<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Регистрация на sheyx-proger." />
    <title>Регистрация — sheyx-proger</title>
    <link rel="stylesheet" href="/style.css" />
    <link rel="stylesheet" href="/app.css" />
    <script src="/app.js" defer></script>
  </head>
  <body class="portal-page">
    <div class="page-bg"></div>
    <main class="portal-card">
      <a class="brand portal-brand" href="/">
        <span class="brand-mark">S</span><span>sheyx-proger</span>
      </a>
      <p class="eyebrow">Начни свой путь</p>
      <h1>Создать аккаунт</h1>
      <p class="portal-intro">Зарегистрируйтесь, чтобы сохранить заявки и следить за обучением.</p>
      <form id="registerForm" class="portal-form">
        <label class="field">
          <span>Имя</span>
          <input name="name" type="text" autocomplete="name" minlength="2" maxlength="80" required />
        </label>
        <label class="field">
          <span>Email</span>
          <input name="email" type="email" autocomplete="email" maxlength="254" required />
        </label>
        <label class="field">
          <span>Пароль (не менее 10 символов)</span>
          <input name="password" type="password" autocomplete="new-password" minlength="10" maxlength="128" required />
        </label>
        <button class="btn btn-primary" type="submit">Зарегистрироваться</button>
        <p class="form-message" role="status" aria-live="polite"></p>
      </form>
      <p class="portal-switch">Уже есть аккаунт? <a href="/login.html">Войти</a></p>
      <a class="portal-home" href="/">← На главную</a>
    </main>
  </body>
</html>
